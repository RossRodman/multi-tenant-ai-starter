name: Push migrations

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-push
  cancel-in-progress: false

jobs:
  push:
    name: Push migrations to hosted Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: hosted
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Check branch
        run: |
          case "$GITHUB_REF" in
            refs/heads/main|refs/heads/dev) ;;
            *)
              echo "::error::Migrations can only be pushed from main or dev, not $GITHUB_REF"
              exit 1
              ;;
          esac

      - name: Check secrets
        run: |
          missing=()
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing secrets in the 'hosted' environment: ${missing[*]}"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: corepack enable

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: yarn

      - run: yarn install --immutable

      - run: yarn supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - run: yarn db:push
        env:
          SUPABASE_YES: "1"
